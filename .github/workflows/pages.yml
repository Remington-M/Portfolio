# Builds the site as static files and publishes them to GitHub Pages.
#
# Every route is prerendered and there is no server code, so the whole site
# exports to plain files. The two environment variables below are what switch
# that on — they are off by default so local development is unaffected.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/portfolio-site-motion-svikm2"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; a queued one supersedes the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
          # A project site is served from /<repo>, not the root of a domain.
          NEXT_PUBLIC_BASE_PATH: /Portfolio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
