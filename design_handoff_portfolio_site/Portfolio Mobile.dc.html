<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics=""><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet"><style>body{margin:0;font-family:Archivo,system-ui,sans-serif}a{color:inherit}a:hover{color:oklch(0.58 0.14 25)}[data-rail]::-webkit-scrollbar{display:none}@keyframes drift{from{background-position:0 0}to{background-position:-320px 0}}</style></helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:oklch(0.963 0.008 80);color:oklch(0.18 0.006 60);box-shadow:0 0 0 1px oklch(0.18 0.006 60 / 0.1)">

<div style="position:absolute;left:0;right:0;top:0;z-index:80;display:flex;justify-content:space-between;align-items:baseline;padding:22px 24px">
<div style="{{ navHome }}"></div>
<div style="{{ navCase }}">
<a href="#" onClick="{{ goHome }}" style="font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:0.1em;text-decoration:none;cursor:pointer">← WORK</a>
</div>
<div style="{{ navLinks }}"><span>Work</span><span style="opacity:0.42">About</span></div>
</div>

<div style="{{ homeStyle }}">
<div data-frame="home" data-intro="300" data-step="300" onScroll="{{ onScroll }}" style="position:relative;width:390px;height:844px;overflow:auto;scroll-snap-type:y proximity">
<div style="position:relative;height:2820px">
<div style="position:sticky;top:0;height:844px;overflow:hidden">

<div style="{{ heroStyle }}">
<div style="text-align:center;font:400 26px/1.28 Archivo,sans-serif;letter-spacing:-0.026em;text-wrap:pretty">Hey, I'm Remington and I make software come to life with motion.</div>
</div>

<sc-for list="{{ pile }}" as="card" hint-placeholder-count="3">
<div data-i="{{ card.i }}" onClick="{{ open }}" style="{{ card.style }}">
<div style="{{ card.screen }}">
<sc-if value="{{ card.hasVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ card.vid }}" ref="{{ vidRef }}" autoPlay muted loop playsInline style="{{ card.vidStyle }}"></video>
</sc-if>
</div>
</div>
</sc-for>

<div style="{{ nowStyle }}">
<div style="font:400 22px/1.14 Archivo,sans-serif;letter-spacing:-0.026em">{{ nowTitle }}</div>
<div style="font:400 9.5px/1 'IBM Plex Mono',monospace;letter-spacing:0.11em;opacity:0.42">{{ nowYear }}</div>
<div style="display:flex;justify-content:center;align-items:center;gap:7px;padding-top:6px">
<sc-for list="{{ dots }}" as="d" hint-placeholder-count="6">
<div data-i="{{ d.i }}" onClick="{{ jumpTo }}" style="{{ d.hit }}">
<div style="{{ d.style }}"></div>
</div>
</sc-for>
</div>
</div>

</div>
<div style="position:absolute;inset:0;display:flex;flex-direction:column;pointer-events:none">
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
<div style="height:300px;scroll-snap-align:start"></div>
</div>
</div>
</div>
</div>

<div style="{{ caseStyle }}">
<sc-if value="{{ onCase }}" hint-placeholder-val="{{ false }}">

<div data-rail="shots" onScroll="{{ onRail }}" onWheel="{{ onWheel }}" onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerCancel="{{ onUp }}" style="{{ railStyle }}">
<sc-for list="{{ rail }}" as="item" hint-placeholder-count="4">
<div data-i="{{ item.i }}" onClick="{{ item.tap }}" style="{{ item.style }}">
<div style="{{ item.screen }}">
<sc-if value="{{ item.hasVideo }}" hint-placeholder-val="{{ false }}">
<video src="{{ item.vid }}" ref="{{ vidRef }}" autoPlay muted loop playsInline style="{{ item.vidStyle }}"></video>
</sc-if>
<div style="{{ item.mark }}">{{ item.mk }}</div>
</div>
</div>
</sc-for>
</div>

<div style="{{ capStyle }}">
<sc-for list="{{ caps }}" as="c" hint-placeholder-count="6">
<div data-screen-label="{{ c.label }}" style="{{ c.style }}">
<div style="font:400 21px/1.14 Archivo,sans-serif;letter-spacing:-0.026em">{{ c.t }}</div>
<div style="padding-top:7px;font:400 9px/1 'IBM Plex Mono',monospace;letter-spacing:0.11em;opacity:0.4">{{ c.meta }}</div>
</div>
</sc-for>
</div>

</sc-if>
</div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  state = { route: 'home', p: 0, pi: 0, sel: null, rp: 0, leaving: false, entered: false };

  projects = [
    { t: 'Airbnb Setup', year: '2025', hue: 30, video: 'media/airbnb-setup.mp4' },
    { t: 'Airbnb Host Experience', year: '2025', hue: 340 },
    { t: 'Airbnb Listing Editor', year: '2024', hue: 300 },
    { t: 'Gesture Navigation', year: '2020', hue: 250 },
    { t: 'The New Google Assistant', year: '2020', hue: 200 },
    { t: 'Google Pixel', year: '2018', hue: 80 }
  ];
  HOME = { w: 252, h: 548, top: 118, r: 34 };
  CASE = { w: 280, h: 609, top: 106, r: 38 };
  GAP = 14;
  SHOTS = 6;

  componentWillUnmount() { clearTimeout(this._t); }

  get pitch() { return this.CASE.w + this.GAP; }

  onScroll = (e) => {
    const el = e.currentTarget, io = +el.dataset.intro || 300, st = +el.dataset.step || 300;
    this.setState({ p: Math.max(0, (el.scrollTop - io) / st), pi: Math.min(1, el.scrollTop / io) });
  };
  onRail = (e) => {
    this.setState({ rp: Math.max(0, e.currentTarget.scrollLeft / this.pitch) });
  };
  onDown = (e) => {
    const el = e.currentTarget;
    this._drag = { x: e.clientX, left: el.scrollLeft, el, moved: false };
    el.style.scrollSnapType = 'none';
    if (el.setPointerCapture && e.pointerId != null) el.setPointerCapture(e.pointerId);
  };
  onMove = (e) => {
    const d = this._drag;
    if (!d) return;
    const dx = e.clientX - d.x;
    if (Math.abs(dx) > 3) d.moved = true;
    d.el.scrollLeft = d.left - dx;
  };
  onUp = () => {
    const d = this._drag;
    if (!d) return;
    this._drag = null;
    d.el.style.scrollSnapType = 'x mandatory';
    const i = Math.round(d.el.scrollLeft / this.pitch);
    d.el.scrollTo({ left: i * this.pitch, behavior: 'smooth' });
  };
  onWheel = (e) => {
    const el = e.currentTarget;
    const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) return;
    el.scrollLeft += d;
    if (e.preventDefault) e.preventDefault();
  };
  jumpTo = (e) => {
    const i = +e.currentTarget.dataset.i, f = e.currentTarget.closest('[data-frame]');
    if (f) f.scrollTo({ top: (+f.dataset.intro || 0) + i * (+f.dataset.step || 300), behavior: 'smooth' });
  };
  cJump = (e) => {
    const i = +e.currentTarget.dataset.i, rail = document.querySelector('[data-rail="shots"]');
    if (rail) rail.scrollTo({ left: i * this.pitch, behavior: 'smooth' });
  };

  open = (e) => {
    const i = +e.currentTarget.dataset.i;
    this.setState({ sel: i, rp: 0, leaving: true, entered: false });
    clearTimeout(this._t);
    this._t = setTimeout(() => {
      this.setState({ route: 'case' });
      this._t = setTimeout(() => this.setState({ entered: true }), 40);
    }, 300);
  };
  goHome = (e) => {
    if (e && e.preventDefault) e.preventDefault();
    clearTimeout(this._t);
    this.setState({ entered: false });
    this._t = setTimeout(() => {
      this.setState({ route: 'home' });
      this._t = setTimeout(() => this.setState({ leaving: false }), 60);
    }, 380);
  };

  pileCards(p, intro, leaving) {
    const ease = 'cubic-bezier(.2,.85,.15,1)';
    const w = this.HOME.w, h = this.HOME.h;
    const cx = 195, cy = Math.round(this.HOME.top + h / 2 + (1 - intro) * 208);
    const n = this.projects.length, deep = n - 1;
    return this.projects.map((pr, i) => {
      const rnd = (k) => { const v = Math.sin((i + 1) * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };
      const jx = (rnd(1) * 2 - 1) * 13, jy = (rnd(2) * 2 - 1) * 7, jr = (rnd(3) * 2 - 1) * 4.2;
      const kc = (((i - p) % n) + n) % n;
      const pos = (k) => ({ x: k * 5 + jx * 0.4 * Math.min(1, k), y: -k * 8 + jy * 0.55 * Math.min(1, k), s: 1 - k * 0.026, r: k < 0.02 ? 0 : jr * (0.3 + 0.12 * k) });
      let x, y, sc, rot, ry = 0, op, z;
      if (kc >= deep) {
        const t = 1 - (kc - deep), ew = t * t * (3 - 2 * t), arc = Math.sin(t * Math.PI);
        const d = pos(deep);
        x = d.x * ew + arc * 140; y = d.y * ew - arc * 26;
        sc = 1 + (d.s - 1) * ew; rot = d.r * ew + arc * 8; ry = -arc * 16;
        op = +(1 - 0.78 * ew).toFixed(3); z = t < 0.5 ? 60 : Math.round(50 - deep);
      } else {
        const g = pos(kc);
        x = g.x; y = g.y; sc = g.s; rot = g.r;
        op = Math.max(0.24, 1 - kc * 0.12); z = Math.round(50 - kc);
      }
      const front = kc < 0.4;
      if (leaving && !front) { y += 300 + kc * 26; rot += kc % 2 ? 9 : -9; op = 0; }
      return {
        key: pr.t, i, hasVideo: !!pr.video, vid: pr.video || '',
        vidStyle: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
        screen: { position: 'absolute', inset: 0, borderRadius: this.HOME.r, overflow: 'hidden' },
        style: {
          position: 'absolute', left: Math.round(cx - w / 2), top: Math.round(cy - h / 2),
          width: w, height: h, boxSizing: 'border-box', borderRadius: this.HOME.r,
          background: `repeating-linear-gradient(135deg,oklch(0.5 0.1 ${pr.hue}) 0 18px,oklch(0.4 0.09 ${pr.hue}) 18px 36px)`,
          backgroundSize: '420px 100%', animation: `drift ${5 + (i % 3)}s linear infinite`,
          boxShadow: '0 20px 40px -22px oklch(0.35 0.02 60 / 0.4), inset 0 0 0 1px oklch(0.18 0.006 60 / 0.09)',
          transform: `perspective(1200px) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${sc.toFixed(3)}) rotate(${rot.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`,
          transformOrigin: '50% 50%', opacity: +Math.max(0, op).toFixed(3), zIndex: z, cursor: 'pointer',
          pointerEvents: front && !leaving ? 'auto' : 'none',
          transition: leaving ? `transform .46s ${ease}, opacity .4s ease` : `opacity .3s ease, box-shadow .5s ${ease}`
        }
      };
    });
  }

  homeDots(p) {
    const n = this.projects.length;
    const a = ((Math.round(p || 0) % n) + n) % n;
    return this.projects.map((pr, i) => {
      const d = Math.abs(i - a);
      return {
        key: pr.t, i,
        hit: { width: i === a ? 26 : 10, height: 20, display: 'flex', alignItems: 'center', cursor: 'pointer', transition: 'width .45s cubic-bezier(.2,.85,.15,1)' },
        style: { width: '100%', height: 1, background: 'currentColor', opacity: d === 0 ? 0.72 : (d === 1 ? 0.26 : 0.13), transition: 'opacity .35s ease' }
      };
    });
  }

  railItems(rp, pr, e) {
    const ease = 'cubic-bezier(.2,.85,.15,1)';
    const C = this.CASE, H = this.HOME;
    const n = this.SHOTS;
    const items = [];
    for (let i = 0; i < n; i++) {
      const d = rp - i, near = Math.min(1, Math.abs(d));
      const hero = i === 0;
      const lift = 1 - near * 0.035;
      const sd = i - rp;
      const tilt = ((sd > 0 ? 1 : -1) * Math.min(1, Math.abs(sd)) * 1).toFixed(2);
      const dropY = (near * 8).toFixed(1);
      const enter = hero ? 1 : e;
      items.push({
        key: 'shot' + i, i, tap: null,
        mk: hero ? '' : String(i + 1).padStart(2, '0'),
        hasVideo: !!(hero && pr && pr.video), vid: hero && pr && pr.video ? pr.video : '',
        vidStyle: { position: 'absolute', inset: 0, width: '100%', height: '100%', objectFit: 'cover', display: 'block' },
        mark: { position: 'absolute', left: 0, right: 0, bottom: 18, textAlign: 'center', font: "400 9.5px/1 'IBM Plex Mono',monospace", letterSpacing: '0.14em', color: 'oklch(0.98 0 0 / 0.24)' },
        screen: {
          position: 'absolute', inset: 0, borderRadius: C.r, overflow: 'hidden',
          background: hero && pr
            ? `repeating-linear-gradient(135deg,oklch(0.5 0.1 ${pr.hue}) 0 18px,oklch(0.4 0.09 ${pr.hue}) 18px 36px)`
            : 'oklch(0.28 0.006 60)',
          backgroundSize: '420px 100%'
        },
        style: {
          position: 'relative', flex: '0 0 auto', width: hero && !e ? H.w : C.w, height: hero && !e ? H.h : C.h,
          borderRadius: C.r, scrollSnapAlign: 'center', overflow: 'hidden',
          boxShadow: '0 24px 48px -24px oklch(0.35 0.02 60 / 0.42), inset 0 0 0 1px oklch(0.18 0.006 60 / 0.09)',
          transformOrigin: '50% 50%',
          transform: `perspective(1000px) translateY(${((1 - enter) * 26 + +dropY).toFixed(1)}px) rotate(${tilt}deg) scale(${lift.toFixed(3)})`,
          opacity: +(enter * (1 - near * 0.24)).toFixed(3),
          transition: `width .55s ${ease}, height .55s ${ease}, transform .55s ${ease}, opacity .4s ease ${hero ? 0 : 0.08}s`
        }
      });
    }
    items.push({
      key: 'return', i: n, tap: this.goHome, mk: 'RETURN TO WORK',
      hasVideo: false, vid: '', vidStyle: {},
      mark: { position: 'absolute', left: 0, right: 0, top: '50%', transform: 'translateY(-50%)', textAlign: 'center', font: "400 9.5px/1 'IBM Plex Mono',monospace", letterSpacing: '0.14em', color: 'oklch(0.28 0.006 60 / 0.6)' },
      screen: { position: 'absolute', inset: 0, borderRadius: C.r, overflow: 'hidden', background: 'oklch(0.912 0.012 80)' },
      style: {
        position: 'relative', flex: '0 0 auto', width: C.w, height: C.h, borderRadius: C.r,
        scrollSnapAlign: 'center', overflow: 'hidden', cursor: 'pointer',
        boxShadow: 'inset 0 0 0 1px oklch(0.18 0.006 60 / 0.12)',
        transformOrigin: '50% 50%',
        transform: `translateY(${(Math.min(1, Math.abs(rp - n)) * 8).toFixed(1)}px) rotate(${(Math.min(1, Math.max(0, n - rp)) * 1).toFixed(2)}deg) scale(${(1 - Math.min(1, Math.abs(rp - n)) * 0.035).toFixed(3)})`,
        opacity: +(e * (1 - Math.min(1, Math.abs(rp - n)) * 0.4)).toFixed(3),
        transition: `transform .55s ${ease}, opacity .4s ease`
      }
    });
    return items;
  }

  renderVals() {
    const p = this.state.p || 0, i = this.state.pi || 0, rp = this.state.rp || 0;
    const onCase = this.state.route === 'case';
    const e = this.state.entered ? 1 : 0;
    const n = this.projects.length;
    const a = ((Math.round(p) % n) + n) % n;
    const pr = this.state.sel != null ? this.projects[this.state.sel] : null;
    const ra = Math.max(0, Math.min(this.SHOTS, Math.round(rp)));
    const chrome = +Math.max(0, Math.min(1, (i - 0.45) * 2.2)).toFixed(3);
    const ease = 'cubic-bezier(.2,.85,.15,1)';
    const capTop = this.CASE.top + this.CASE.h + 30;
    const shots = [];
    for (let k = 0; k < this.SHOTS; k++) {
      shots.push(k === 0
        ? { t: pr ? pr.t : '', meta: pr ? pr.year : '', label: '01 Overview' }
        : { t: 'Shot ' + String(k).padStart(2, '0'), meta: 'TO BE POPULATED', label: String(k + 1).padStart(2, '0') + ' Shot' });
    }
    return {
      onScroll: this.onScroll, onRail: this.onRail, onWheel: this.onWheel, onDown: this.onDown, onMove: this.onMove, onUp: this.onUp, jumpTo: this.jumpTo, cJump: this.cJump, open: this.open, goHome: this.goHome, onCase,
      vidRef: (el) => { if (el) { el.muted = true; const q = el.play(); if (q && q.catch) q.catch(() => {}); } },
      pile: this.pileCards(p, i, this.state.leaving),
      dots: this.homeDots(p),
      nowTitle: this.projects[a].t, nowYear: this.projects[a].year,
      navHome: { opacity: onCase ? 0 : 1, transition: 'opacity .3s ease', pointerEvents: onCase ? 'none' : 'auto' },
      navLinks: { display: 'flex', gap: 16, font: "500 10px/1 'IBM Plex Mono',monospace", letterSpacing: '0.06em', textTransform: 'uppercase', opacity: onCase ? 0 : 1, transition: 'opacity .3s ease', pointerEvents: onCase ? 'none' : 'auto' },
      navCase: { position: 'absolute', left: 24, top: 22, display: 'flex', alignItems: 'baseline', gap: 12, opacity: onCase ? 1 : 0, transform: onCase ? 'none' : 'translateX(-8px)', transition: 'opacity .35s ease .12s, transform .45s cubic-bezier(.2,.85,.15,1)', pointerEvents: onCase ? 'auto' : 'none' },
      heroStyle: { position: 'absolute', left: 24, right: 24, top: 132, zIndex: 52, opacity: +Math.max(0, 1 - i * 1.9).toFixed(3), transform: `translateY(${(-i * 34).toFixed(1)}px)`, pointerEvents: i > 0.4 ? 'none' : 'auto' },
      nowStyle: { position: 'absolute', left: 24, right: 24, bottom: 36, zIndex: 56, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 9, textAlign: 'center', opacity: +(chrome * (this.state.leaving ? 0 : 1)).toFixed(3), transition: 'opacity .3s ease' },
      homeStyle: { position: 'absolute', inset: 0, opacity: onCase ? 0 : 1, pointerEvents: onCase ? 'none' : 'auto', transition: 'opacity .28s ease' },
      caseStyle: { position: 'absolute', inset: 0, opacity: onCase ? 1 : 0, pointerEvents: onCase ? 'auto' : 'none', transition: 'opacity .2s ease' },
      railStyle: {
        position: 'absolute', left: 0, right: 0, top: this.CASE.top, height: this.CASE.h + 40,
        display: 'flex', alignItems: 'flex-start', gap: this.GAP,
        padding: `0 ${(390 - this.CASE.w) / 2}px`, boxSizing: 'border-box',
        overflowX: 'auto', overflowY: 'hidden', scrollSnapType: 'x mandatory',
        scrollbarWidth: 'none', zIndex: 52, cursor: 'grab', touchAction: 'pan-x'
      },
      rail: this.railItems(rp, pr, e),
      capStyle: { position: 'absolute', left: 24, right: 24, top: capTop, height: 50, zIndex: 56, textAlign: 'center', opacity: e, transform: `translateY(${((1 - e) * 14).toFixed(1)}px)`, transition: `opacity .4s ease .1s, transform .5s ${ease}` },
      caps: shots.map((s, k) => {
        const d = rp - k;
        return {
          key: 'cap' + k, t: s.t, meta: s.meta, label: s.label,
          style: { position: 'absolute', left: 0, right: 0, top: 0, opacity: +Math.max(0, 1 - Math.abs(d) * 2.4).toFixed(3), transform: `translateX(${(d * 26).toFixed(1)}px)`, transition: 'opacity .2s linear' }
        };
      }),
    };
  }
}

</script>
</body>
</html>
